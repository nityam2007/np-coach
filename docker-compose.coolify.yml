# Coolify production stack. Select this root-level file with the Docker Compose
# build pack. Coolify supplies the reverse proxy and isolated network; only assign
# domains to `web` (port 3000) and `directus` (port 8055) in its UI.

x-directus-database: &directus-database
  DB_CLIENT: mysql
  DB_HOST: database
  DB_PORT: "3306"
  DB_DATABASE: npcoaches
  DB_USER: directus
  DB_PASSWORD: ${SERVICE_PASSWORD_64_DBUSER}

x-directus-bootstrap: &directus-bootstrap
  <<: *directus-database
  KEY: ${SERVICE_BASE64_64_DIRECTUSKEY}
  SECRET: ${SERVICE_BASE64_64_DIRECTUSSECRET}
  ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?}
  ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?}
  ADMIN_TOKEN: ${SERVICE_BASE64_64_DIRECTUSADMIN}

services:
  database:
    networks:
      - database
    image: mariadb:11.8.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: npcoaches
      MARIADB_USER: directus
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_64_DBUSER}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_DBROOT}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  redis:
    networks:
      - cache
    image: redis:7.4.10-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDISPASS}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 768mb --maxmemory-policy noeviction --lazyfree-lazy-expire yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  schema-migrate:
    networks:
      - database
    build:
      context: .
      dockerfile: Dockerfile.schema
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["/bin/sh", "-c"]
    # Routine Git deployments must never reconcile the live database to an exact
    # snapshot. bootstrap only installs/upgrades Directus system tables; the
    # cms-bootstrap service performs additive, idempotent app migrations.
    command: ["npx directus bootstrap"]
    environment:
      <<: *directus-bootstrap
    depends_on:
      database:
        condition: service_healthy

  directus:
    networks:
      - default
      - database
      - cache
    image: directus/directus:12.3.0
    restart: unless-stopped
    expose:
      - "8055"
    environment:
      <<: *directus-bootstrap
      PUBLIC_URL: ${NEXT_PUBLIC_DIRECTUS_URL:?}
      CORS_ENABLED: "true"
      CORS_ORIGIN: "array:${NEXT_PUBLIC_SITE_URL:?}"
      WEBSOCKETS_ENABLED: "false"
      TUS_ENABLED: "false"
      GRAPHQL_ENABLED: "false"
      REDIS: redis://:${SERVICE_PASSWORD_64_REDISPASS}@redis:6379
      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: redis
      CACHE_TTL: 30m
      CACHE_STATUS_HEADER: X-Directus-Cache
      CACHE_VALUE_MAX_SIZE: 10mb
      CACHE_SCHEMA_FREEZE_ENABLED: "true"
      ASSETS_CACHE_TTL: 30d
      ASSETS_TRANSFORM_MAX_CONCURRENT: "8"
      ASSETS_TRANSFORM_TIMEOUT: 15s
      SYNCHRONIZATION_STORE: redis
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "50"
      RATE_LIMITER_DURATION: "1"
      RATE_LIMITER_STORE: redis
      IP_TRUST_PROXY: "true"
      HSTS_ENABLED: "true"
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      SESSION_COOKIE_SECURE: "true"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?}
      EXTENSIONS_MUST_LOAD: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - ./extensions:/directus/extensions:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cms-bootstrap:
    networks:
      - default
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    restart: "no"
    exclude_from_hc: true
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_TOKEN: ${SERVICE_BASE64_64_DIRECTUSADMIN}
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?}
      DIRECTUS_BOOTSTRAP_REQUEST_INTERVAL_MS: ${DIRECTUS_BOOTSTRAP_REQUEST_INTERVAL_MS:-50}
      DIRECTUS_BOOTSTRAP_MAX_RETRIES: ${DIRECTUS_BOOTSTRAP_MAX_RETRIES:-10}
      DIRECTUS_BOOTSTRAP_REQUEST_TIMEOUT_MS: ${DIRECTUS_BOOTSTRAP_REQUEST_TIMEOUT_MS:-30000}
    depends_on:
      directus:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  web:
    networks:
      - default
      - cache
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:?}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID:-G-3GXSRDBP55}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-PEWp9KTyvJeyPa_1TpAQO3fdLzljRv8RnNggD-h8gsg}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_SERVER_TOKEN: ${DIRECTUS_SERVER_TOKEN:-}
      REDIS_URL: redis://:${SERVICE_PASSWORD_64_REDISPASS}@redis:6379
      AUTH_SECRET: ${SERVICE_BASE64_64_WEBAUTH}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:-}
      OTP_PEPPER: ${OTP_PEPPER:-}
      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:-}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:?}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID:-G-3GXSRDBP55}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-PEWp9KTyvJeyPa_1TpAQO3fdLzljRv8RnNggD-h8gsg}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DAILY_EXPRESS_BOOKINGS_ENABLED: ${DAILY_EXPRESS_BOOKINGS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-postfix}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@np-coaches.co.uk}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NP Coaches}
      CONTACT_TO: ${CONTACT_TO:-info@np-coaches.co.uk}
      QUOTE_TO: ${QUOTE_TO:-bookings@np-coaches.co.uk}
      LOST_PROPERTY_TO: ${LOST_PROPERTY_TO:-info@np-coaches.co.uk}
    depends_on:
      cms-bootstrap:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

networks:
  database:
    internal: true
  cache:
    internal: true

volumes:
  mariadb_data:
  redis_data:
  directus_uploads:
