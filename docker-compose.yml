# Dev environment — plain. Code is bind-mounted so edits hot-reload without
# rebuilding any container. Reads variables from `.env` (copy from `.env.example`).
#
#   docker compose up        # starts MariaDB + Directus + the Next.js app
#   web      → http://localhost:3000
#   directus → http://localhost:8055

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-npcoaches}
      MARIADB_USER: ${DB_USER:-directus}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-too}
    volumes:
      # Named volume for DB data (persistence — not code, so not a bind mount).
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:12.3.0
    restart: unless-stopped
    ports:
      - "8055:8055"
    depends_on:
      db:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY:-dev-key-change-me}
      SECRET: ${DIRECTUS_SECRET:-dev-secret-change-me}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me-32}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-}
      EXTENSIONS_MUST_LOAD: "true"
      DB_CLIENT: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-npcoaches}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@np-coaches.co.uk}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}
      PUBLIC_URL: http://localhost:8055
      CORS_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000
      WEBSOCKETS_ENABLED: "true" # realtime + live updates in the admin
      MARKETPLACE_TRUST: all # dev: allow installing any Marketplace extension (review before prod)
      EXTENSIONS_AUTO_RELOAD: "true"
    volumes:
      # Bind mounts keep uploads persistent and load the required private endpoint.
      - ./directus/uploads:/directus/uploads
      - ./extensions:/directus/extensions:ro

  # web:
  #   image: node:20
