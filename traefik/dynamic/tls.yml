# Traefik dynamic config: load the Cloudflare Origin certificate so Traefik serves
# valid TLS to Cloudflare (Full-strict). Put the cert/key in ../certs (not committed).
# Generate the Origin cert in Cloudflare → SSL/TLS → Origin Server → Create Certificate.
tls:
  certificates:
    - certFile: /etc/traefik/certs/origin.pem
      keyFile: /etc/traefik/certs/origin-key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/origin.pem
        keyFile: /etc/traefik/certs/origin-key.pem
